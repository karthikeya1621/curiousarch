name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      # sim/whatif's prose path hits the real Anthropic API (ANTHROPIC_API_KEY)
      # and is intentionally excluded from CI — do not add it here.
